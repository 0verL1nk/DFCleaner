<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Shadow -->
  <rect x="20" y="24" width="480" height="480" rx="108" ry="108" fill="#000" opacity="0.4"/>

  <!-- Background -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#bg)"/>

  <!-- Outer ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.12"/>

  <!-- Inner ring -->
  <circle cx="256" cy="256" r="120" fill="none" stroke="#22d3ee" stroke-width="3" opacity="0.18"/>

  <!-- Sweep arc - the main visual: a partial ring being "cleaned" -->
  <path d="M 256 106 A 150 150 0 1 1 150 150" fill="none" stroke="url(#cyan)" stroke-width="8" stroke-linecap="round" opacity="0.6" filter="url(#glow)"/>

  <!-- Center: clean dot -->
  <circle cx="256" cy="256" r="16" fill="#22d3ee" opacity="0.7" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="7" fill="white" opacity="0.95"/>

  <!-- Debris dots being swept away -->
  <circle cx="380" cy="180" r="4" fill="#22d3ee" opacity="0.4"/>
  <circle cx="395" cy="200" r="3" fill="#22d3ee" opacity="0.3"/>
  <circle cx="370" cy="165" r="2.5" fill="#22d3ee" opacity="0.2"/>
  <circle cx="400" cy="170" r="2" fill="#22d3ee" opacity="0.15"/>

  <!-- Single AI sparkle -->
  <g transform="translate(370, 110)" filter="url(#glow)">
    <path d="M 0 -24 L 5.5 -5.5 L 24 0 L 5.5 5.5 L 0 24 L -5.5 5.5 L -24 0 L -5.5 -5.5 Z" fill="#22d3ee" opacity="0.85"/>
  </g>

  <!-- Small secondary sparkle -->
  <g transform="translate(395, 150)">
    <path d="M 0 -10 L 2.5 -2.5 L 10 0 L 2.5 2.5 L 0 10 L -2.5 2.5 L -10 0 L -2.5 -2.5 Z" fill="#67e8f9" opacity="0.5"/>
  </g>
</svg>
