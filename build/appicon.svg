<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="disk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Shadow -->
  <rect x="20" y="24" width="480" height="480" rx="108" ry="108" fill="#1e1b4b" opacity="0.3"/>

  <!-- Background -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#bg)"/>

  <!-- Grid -->
  <g opacity="0.08">
    <line x1="128" y1="80" x2="128" y2="432" stroke="white" stroke-width="1"/>
    <line x1="256" y1="80" x2="256" y2="432" stroke="white" stroke-width="1"/>
    <line x1="384" y1="80" x2="384" y2="432" stroke="white" stroke-width="1"/>
    <line x1="80" y1="160" x2="432" y2="160" stroke="white" stroke-width="1"/>
    <line x1="80" y1="280" x2="432" y2="280" stroke="white" stroke-width="1"/>
    <line x1="80" y1="370" x2="432" y2="370" stroke="white" stroke-width="1"/>
  </g>

  <!-- Disk body shadow -->
  <rect x="92" y="106" width="336" height="260" rx="32" ry="32" fill="#1e1b4b" opacity="0.15"/>

  <!-- Disk body -->
  <rect x="88" y="100" width="336" height="260" rx="32" ry="32" fill="url(#disk)"/>
  <rect x="88" y="100" width="336" height="50" rx="32" ry="32" fill="white" opacity="0.2"/>
  <rect x="88" y="126" width="336" height="24" fill="white" opacity="0.2"/>

  <!-- Disk platter -->
  <circle cx="256" cy="230" r="80" fill="none" stroke="#6366f1" stroke-width="6" opacity="0.2"/>
  <circle cx="256" cy="230" r="55" fill="none" stroke="#6366f1" stroke-width="4" opacity="0.15"/>
  <circle cx="256" cy="230" r="16" fill="#6366f1" opacity="0.3"/>
  <circle cx="256" cy="230" r="6" fill="#818cf8"/>

  <!-- Sweep arc -->
  <path d="M 160 180 A 100 100 0 0 1 340 200" fill="none" stroke="white" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
  <path d="M 175 175 A 90 90 0 0 1 320 190" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.3"/>

  <!-- Bar chart -->
  <g transform="translate(110, 300)">
    <rect x="0" y="30" width="40" height="50" rx="6" fill="white" opacity="0.3"/>
    <rect x="56" y="10" width="40" height="70" rx="6" fill="white" opacity="0.3"/>
    <rect x="112" y="-10" width="40" height="90" rx="6" fill="white" opacity="0.3"/>
    <rect x="168" y="20" width="40" height="60" rx="6" fill="white" opacity="0.3"/>
    <rect x="224" y="40" width="40" height="40" rx="6" fill="white" opacity="0.15"/>
    <path d="M 140 -5 L 240 50" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <polygon points="240,50 228,42 234,54" fill="#fbbf24" opacity="0.8"/>
  </g>

  <!-- AI Sparkles -->
  <g transform="translate(380, 100)" filter="url(#glow)">
    <path d="M 0 -28 L 6 -6 L 28 0 L 6 6 L 0 28 L -6 6 L -28 0 L -6 -6 Z" fill="url(#spark)"/>
  </g>
  <g transform="translate(350, 140)" filter="url(#glow)">
    <path d="M 0 -16 L 4 -4 L 16 0 L 4 4 L 0 16 L -4 4 L -16 0 L -4 -4 Z" fill="url(#spark)"/>
  </g>
  <g transform="translate(400, 155)">
    <path d="M 0 -10 L 2.5 -2.5 L 10 0 L 2.5 2.5 L 0 10 L -2.5 2.5 L -10 0 L -2.5 -2.5 Z" fill="#fde68a"/>
  </g>

  <!-- DF text -->
  <text x="256" y="448" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="56" font-weight="700" fill="white" opacity="0.95" letter-spacing="-1">DF</text>
</svg>
