<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Shadow -->
  <rect x="20" y="24" width="480" height="480" rx="108" ry="108" fill="#000" opacity="0.4"/>

  <!-- Dark background -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.06">
    <line x1="128" y1="80" x2="128" y2="432" stroke="white" stroke-width="1"/>
    <line x1="256" y1="80" x2="256" y2="432" stroke="white" stroke-width="1"/>
    <line x1="384" y1="80" x2="384" y2="432" stroke="white" stroke-width="1"/>
    <line x1="80" y1="160" x2="432" y2="160" stroke="white" stroke-width="1"/>
    <line x1="80" y1="280" x2="432" y2="280" stroke="white" stroke-width="1"/>
  </g>

  <!-- Circular scan area -->
  <circle cx="256" cy="220" r="110" fill="none" stroke="#22d3ee" stroke-width="3" opacity="0.15"/>
  <circle cx="256" cy="220" r="80" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.1"/>
  <circle cx="256" cy="220" r="50" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.08"/>

  <!-- Scan sweep arc -->
  <path d="M 180 150 A 100 100 0 0 1 330 180" fill="none" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" opacity="0.6" filter="url(#glow)"/>

  <!-- Center dot -->
  <circle cx="256" cy="220" r="8" fill="#22d3ee" opacity="0.8"/>
  <circle cx="256" cy="220" r="4" fill="white"/>

  <!-- Bar chart -->
  <g transform="translate(108, 310)">
    <rect x="0" y="30" width="44" height="55" rx="6" fill="#22d3ee" opacity="0.15"/>
    <rect x="60" y="10" width="44" height="75" rx="6" fill="#22d3ee" opacity="0.2"/>
    <rect x="120" y="-5" width="44" height="90" rx="6" fill="#22d3ee" opacity="0.35"/>
    <rect x="180" y="20" width="44" height="65" rx="6" fill="#22d3ee" opacity="0.2"/>
    <rect x="240" y="40" width="44" height="45" rx="6" fill="#22d3ee" opacity="0.1"/>
  </g>

  <!-- Decline line -->
  <path d="M 145 305 L 360 365" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" opacity="0.6" filter="url(#glow)"/>
  <circle cx="360" cy="365" r="5" fill="#22d3ee" opacity="0.8"/>

  <!-- AI Sparkle large -->
  <g transform="translate(370, 95)" filter="url(#glow)">
    <path d="M 0 -30 L 7 -7 L 30 0 L 7 7 L 0 30 L -7 7 L -30 0 L -7 -7 Z" fill="url(#spark)"/>
  </g>

  <!-- AI Sparkle medium -->
  <g transform="translate(340, 145)">
    <path d="M 0 -16 L 4 -4 L 16 0 L 4 4 L 0 16 L -4 4 L -16 0 L -4 -4 Z" fill="#67e8f9" opacity="0.8"/>
  </g>

  <!-- AI Sparkle small -->
  <g transform="translate(395, 155)">
    <path d="M 0 -10 L 2.5 -2.5 L 10 0 L 2.5 2.5 L 0 10 L -2.5 2.5 L -10 0 L -2.5 -2.5 Z" fill="#a5f3fc" opacity="0.6"/>
  </g>

  <!-- DF text -->
  <text x="256" y="448" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="700" fill="white" opacity="0.9" letter-spacing="2">DF</text>
</svg>
