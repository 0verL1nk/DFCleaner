<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Shadow -->
  <rect x="20" y="24" width="480" height="480" rx="108" ry="108" fill="#000" opacity="0.4"/>

  <!-- Dark background -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.05">
    <line x1="128" y1="80" x2="128" y2="432" stroke="white" stroke-width="1"/>
    <line x1="256" y1="80" x2="256" y2="432" stroke="white" stroke-width="1"/>
    <line x1="384" y1="80" x2="384" y2="432" stroke="white" stroke-width="1"/>
    <line x1="80" y1="160" x2="432" y2="160" stroke="white" stroke-width="1"/>
    <line x1="80" y1="280" x2="432" y2="280" stroke="white" stroke-width="1"/>
    <line x1="80" y1="370" x2="432" y2="370" stroke="white" stroke-width="1"/>
  </g>

  <!-- Concentric scan rings -->
  <circle cx="256" cy="230" r="120" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.1"/>
  <circle cx="256" cy="230" r="90" fill="none" stroke="#22d3ee" stroke-width="2.5" opacity="0.15"/>
  <circle cx="256" cy="230" r="60" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.12"/>

  <!-- Scan sweep arc -->
  <path d="M 176 145 A 120 120 0 0 1 340 200" fill="none" stroke="url(#accent)" stroke-width="7" stroke-linecap="round" opacity="0.5" filter="url(#glow)"/>
  <path d="M 195 160 A 95 95 0 0 1 320 195" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" opacity="0.25"/>

  <!-- Center dot with glow -->
  <circle cx="256" cy="230" r="12" fill="#22d3ee" opacity="0.6" filter="url(#softglow)"/>
  <circle cx="256" cy="230" r="6" fill="white" opacity="0.95"/>

  <!-- Broom / sweep icon representing cleaning -->
  <g transform="translate(256, 380) rotate(-15)" filter="url(#softglow)">
    <!-- Broom handle -->
    <rect x="-3" y="-100" width="6" height="80" rx="3" fill="#94a3b8" opacity="0.7"/>
    <!-- Broom head -->
    <path d="M -20 -20 Q -22 0 -18 20 L 18 20 Q 22 0 20 -20 Z" fill="#22d3ee" opacity="0.5"/>
    <path d="M -14 -16 Q -16 0 -12 16 L 12 16 Q 16 0 14 -16 Z" fill="#67e8f9" opacity="0.4"/>
    <!-- Sparkle dust lines -->
    <line x1="-28" y1="0" x2="-40" y2="-8" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <line x1="-30" y1="12" x2="-44" y2="8" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    <line x1="-26" y1="22" x2="-38" y2="24" stroke="#22d3ee" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
  </g>

  <!-- Bar chart (disk usage declining) -->
  <g transform="translate(80, 360)">
    <rect x="0" y="20" width="32" height="50" rx="5" fill="white" opacity="0.12"/>
    <rect x="42" y="5" width="32" height="65" rx="5" fill="white" opacity="0.12"/>
    <rect x="84" y="-8" width="32" height="78" rx="5" fill="white" opacity="0.15"/>
    <rect x="126" y="10" width="32" height="60" rx="5" fill="white" opacity="0.1"/>
    <!-- Decline arrow -->
    <path d="M 30 8 L 150 50" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- AI Sparkle large -->
  <g transform="translate(380, 100)" filter="url(#glow)">
    <path d="M 0 -30 L 7 -7 L 30 0 L 7 7 L 0 30 L -7 7 L -30 0 L -7 -7 Z" fill="url(#spark)"/>
  </g>

  <!-- AI Sparkle medium -->
  <g transform="translate(345, 150)">
    <path d="M 0 -16 L 4 -4 L 16 0 L 4 4 L 0 16 L -4 4 L -16 0 L -4 -4 Z" fill="#67e8f9" opacity="0.7"/>
  </g>

  <!-- AI Sparkle small -->
  <g transform="translate(400, 160)">
    <path d="M 0 -10 L 2.5 -2.5 L 10 0 L 2.5 2.5 L 0 10 L -2.5 2.5 L -10 0 L -2.5 -2.5 Z" fill="#a5f3fc" opacity="0.5"/>
  </g>
</svg>
